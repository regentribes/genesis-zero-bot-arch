<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyCoNet v2 — Archi Viewer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--text:#888;--heading:#fff;--muted:#555;--border:#222;--accent:#50c878}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.topbar{background:#111;border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem}
.topbar h1{color:var(--heading);font-size:.95rem;font-weight:600}
.topbar a{color:var(--accent);text-decoration:none;font-size:.8rem;margin-left:auto}
.topbar a:hover{text-decoration:underline}
.viewer{flex:1;overflow:hidden}
.viewer iframe{width:100%;height:100%;border:none;display:block}
.load{border:none;display:block}
</style>
</head>
<body>
  <div class="topbar">
    <h1>MyCoNet v2 — Community Operating System</h1>
    <a href="models.html">&#8592; All Models</a>
  </div>
  <div class="viewer">
    <iframe src="viewers/myconet-v2/elements/model.html" title="MyCoNet v2"></iframe>
  </div>
</body>
</html>
