<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Skills Development — ArchiMate Model Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #888; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      background: #0a0a0a;
      border-bottom: 1px solid #222;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .topbar h1 { color: #fff; font-size: 1rem; font-weight: 600; }
    .topbar p { color: #555; font-size: 0.85rem; }
    .topbar a { color: #4a9eff; text-decoration: none; font-size: 0.85rem; }
    .topbar a:hover { text-decoration: underline; }
    .viewer-wrap { flex: 1; position: relative; }
    .viewer-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; color: #555; font-size: 0.9rem; pointer-events: none;
      transition: opacity 0.4s;
    }
    .loading.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>AI Skills Development</h1>
      <p>Community AI skills verification system aligned with NVIDIA certification tiers.</p>
    </div>
    <a href="models.html">&#8592; All models</a>
  </div>
  <div class="viewer-wrap">
    <div class="loading" id="loader">Loading Archi viewer…</div>
    <iframe src="viewers/ai-skills-dev/index.html" title="AI Skills Development" id="viewer" onload="document.getElementById('loader').classList.add('hidden')"></iframe>
  </div>
</body>
</html>
