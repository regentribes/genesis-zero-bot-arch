name: Deploy ArchiMate Models + HTML Reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Initialize gh-pages branch
        run: |
          set -e
          git config --global user.email "genesis-zero-bot@users.noreply.github.com"
          git config --global user.name "genesis-zero-bot"
          # Check if gh-pages exists on remote
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages already exists"
          else
            echo "Creating initial gh-pages branch"
            git checkout --orphan gh-pages
            git commit -m "Initial gh-pages deployment" --allow-empty
            git push origin gh-pages
            git checkout main
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build custom index
        run: python3 build_index.py

      - name: Run Archi HTML Report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/archi/project" \
            -e ARCHI_PROJECT_PATH=/archi/project \
            -e ARCHI_HTML_REPORT_ENABLED=true \
            -e ARCHI_REPORT_PATH=/archi/project/.archi_report \
            ghcr.io/woozymasta/archimate-ci-image:5.7.0-1.0.6

      - name: Deploy Archi report to gh-pages
        uses: WoozyMasta/archimate-ci-image@5.7.0-1.0.6
        with:
          archiHtmlReportEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          githubPagesBranch: gh-pages
          gitSubtreePrefix: .archi_report

      - name: Add custom index to gh-pages
        run: |
          set -e
          GH_PAGES_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GH_PAGES_DIR"
          cp _site/index.html "$GH_PAGES_DIR/"
          cd "$GH_PAGES_DIR"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add index.html
          git commit -m "chore: add custom index page" || true
          git push origin gh-pages
          rm -rf "$GH_PAGES_DIR"

      - name: Trigger Pages deployment
        run: |
          set -e
          GH_PAGES_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GH_PAGES_DIR"
          cd "$GH_PAGES_DIR"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          date >> .deploy-trigger
          git add .deploy-trigger
          git commit -m "ci: trigger Pages deployment" || true
          git push origin gh-pages
          rm -rf "$GH_PAGES_DIR"
