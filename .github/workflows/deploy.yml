name: Deploy ArchiMate Models + HTML Reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # ─── Build custom styled index ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build custom index
        run: python3 - << 'PYEOF'
import re
from pathlib import Path

model_count = len(list(Path("models").glob("*.archimate")))

html = '''<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArchiMate Models — RegenTribes</title>
<style>
:root{--bg:#000;--text:#888;--heading:#fff;--muted:#555;--border:#222;--code-bg:#0a0a0a}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;margin:0;padding:2rem;transition:background .2s,color .2s}
.light{--bg:#fff;--text:#333;--heading:#000;--muted:#888;--border:#e0e0e0;--code-bg:#f5f5f5}
a{color:#4a9eff}
h1{color:var(--heading);margin:0 0 1rem}
h2{color:var(--heading);margin:2rem 0 .5rem;font-size:1.2rem}
p{color:var(--muted);margin:0 0 1.5rem}
nav{margin-bottom:2rem}
button{background:var(--border);color:var(--text);border:1px solid var(--muted);padding:.3rem .8rem;cursor:pointer}
iframe{width:100%;height:600px;border:1px solid var(--border);background:#fff;margin-top:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin:1rem 0}
.card{background:var(--code-bg);border:1px solid var(--border);padding:1rem;border-radius:4px}
.card h3{color:var(--heading);margin:0 0 .5rem;font-size:1rem}
.card p{color:var(--muted);margin:0}
</style>
<script>
document.addEventListener("DOMContentLoaded",function(){
  var t=localStorage.getItem("theme")||"dark";
  document.body.className=t;
});
</script>
</head>
<body>
<nav><button onclick="document.body.className=document.body.className==='dark'?'light':'dark';localStorage.setItem('theme',document.body.className)">&#9790;</button></nav>
<h1>ArchiMate Models — RegenTribes</h1>
<p>Enterprise architecture models. ''' + str(model_count) + ''' models. Archi v5.7.0 via archimate-ci-image.</p>

<h2>Regenerative Neighbourhood</h2>
<div class="grid">
  <div class="card"><h3>Core Architecture</h3><p>Physical, knowledge, and governance infrastructure for regenerative communities.</p></div>
</div>
<iframe src=".archi_report/html/index.html?model=regen-neighbourhood" title="Regen Neighbourhood"></iframe>

<h2>Integral Collective Node</h2>
<div class="grid">
  <div class="card"><h3>OAD → ITC → CDS → COS → FRS</h3><p>Five-subsystem governance loop for regenerative community nodes.</p></div>
</div>
<iframe src=".archi_report/html/index.html?model=integral-collective" title="Integral Collective"></iframe>

<h2>Reference Models (archimate-ci-image)</h2>
<div class="grid">
  <div class="card"><h3>ArchiMetal Reference</h3><p>Full ArchiMate model demonstrating deploy-archi-report integration.</p></div>
</div>
<iframe src=".archi_report/html/index.html" title="ArchiMetal"></iframe>

<p style="margin-top:2rem;color:var(--muted);font-size:.85rem">
Built by <a href="https://github.com/regentribes/genesis-zero-bot-arch">genesis-zero-bot-arch</a>
— Archi HTML reports via <a href="https://github.com/marketplace/actions/deploy-archi-report">deploy-archi-report</a>
</p>
</body>
</html>'''

Path("_site/index.html").write_text(html)
print("Custom index written")
PYEOF

      # ─── Run Archi via Docker to generate HTML reports ─────────────────────────
      # Docker available on ubuntu-latest (linux/amd64).
      # Uses Xvfb for headless GUI rendering. No JArchi plugin needed.
      # The archimate-ci-image container bundles Archi 5.7.0.
      - name: Run Archi HTML Report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/archi/project" \
            -v "${{ github.workspace }}/reports:/archi/report" \
            -e ARCHI_PROJECT_PATH=/archi/project \
            -e ARCHI_HTML_REPORT_ENABLED=true \
            ghcr.io/woozymasta/archimate-ci-image:5.7.0-1.0.6

      # ─── Deploy Archi reports to gh-pages ────────────────────────────────────
      # deploy-archi-report action pushes Archi HTML output to gh-pages branch
      # via git subtree split. This is the Pages deployment mechanism.
      # Pages is configured to serve from gh-pages branch (legacy build_type).
      - name: Deploy Archi report to gh-pages
        uses: WoozyMasta/archimate-ci-image@5.7.0-1.0.6
        with:
          archiHtmlReportEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          githubPagesBranch: gh-pages
          gitSubtreePrefix: .archi_report

      # ─── Add custom index to gh-pages root ───────────────────────────────────
      # After deploy-archi pushes Archi reports to .archi_report/ on gh-pages,
      # we clone gh-pages and add our custom index.html at the root.
      - name: Add custom index to gh-pages
        run: |
          set -e
          GH_PAGES_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GH_PAGES_DIR" 2>/dev/null || {
            # gh-pages may not exist yet, create it
            git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$GH_PAGES_DIR" 2>/dev/null || true
          }
          # Copy custom index to gh-pages root
          mkdir -p "$GH_PAGES_DIR"
          cp _site/index.html "$GH_PAGES_DIR/"
          cd "$GH_PAGES_DIR"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add index.html
          git commit -m "chore: add custom index page" || true
          git push origin gh-pages || echo "push done or no changes"
          rm -rf "$GH_PAGES_DIR"
          echo "Custom index committed to gh-pages"

      # ─── Trigger Pages deployment ────────────────────────────────────────────
      # Pages needs a new deployment event. We add an empty commit to gh-pages.
      - name: Trigger Pages deployment
        run: |
          set -e
          GH_PAGES_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$GH_PAGES_DIR" 2>/dev/null
          cd "$GH_PAGES_DIR"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          # Touch a file and commit to trigger Pages rebuild
          date >> .deploy-trigger
          git add .deploy-trigger
          git commit -m "ci: trigger Pages deployment" || true
          git push origin gh-pages || echo "push done"
          rm -rf "$GH_PAGES_DIR"
